[package]
name = 'pm_rs'
version = '0.1.0'
edition = '2021'

[lib]
crate-type = ['staticlib']
name = 'pm_rs'

[dependencies]
extendr-api = "=0.9.0"
pmcore = { version = "0.26.2", features = ["dsl-jit"] }

rayon = "1.12.0"
anyhow = "1.0.103"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
mimalloc = { version = "0.1.43", features = ["local_dynamic_tls"] }
