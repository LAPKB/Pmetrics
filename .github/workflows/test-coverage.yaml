# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help
name: test-coverage

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
    contents: read

jobs:
    test-coverage:
        runs-on: ubuntu-latest
        env:
            GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
            # Build the Rust static library in "not CRAN" mode so cargo uses the
            # shared ~/.cargo home (populated by the warm-fetch + rust-cache steps)
            # instead of a throwaway package-local .cargo dir. This makes the Rust
            # build that covr triggers during instrumentation fast and reliable.
            NOT_CRAN: "true"
        steps:
            - uses: actions/checkout@v7

            - name: Set up Rust
              uses: dtolnay/rust-toolchain@stable

            - name: Cache Rust dependencies
              uses: Swatinem/rust-cache@v2
              with:
                  # covr::package_coverage() compiles the package in place, so the
                  # Rust artifacts land in src/rust/target (per src/Makevars) and can
                  # be restored across runs, unlike R CMD check which builds in a
                  # throwaway copy.
                  workspaces: ". -> src/rust/target"
                  cache-on-failure: true
                  cache-all-crates: true

            - name: Warm Cargo registry (pre-fetch dependencies)
              run: rustup run stable cargo fetch --manifest-path src/rust/Cargo.toml

            - name: Set up Pandoc
              uses: r-lib/actions/setup-pandoc@v2

            - name: Set up R
              uses: r-lib/actions/setup-r@v2
              with:
                  use-public-rspm: true
                  extra-repositories: https://lapkb.r-universe.dev

            - name: Install dependencies
              uses: r-lib/actions/setup-r-dependencies@v2
              with:
                  extra-packages: any::covr, any::xml2, any::mclust, any::npde
                  needs: coverage
              continue-on-error: true
              id: install-deps

            - name: Retry Install dependencies
              if: steps.install-deps.outcome == 'failure'
              uses: r-lib/actions/setup-r-dependencies@v2
              with:
                  extra-packages: any::covr, any::xml2, any::mclust, any::npde
                  needs: coverage

            - name: Test coverage
              run: |
                  cov <- covr::package_coverage(
                    quiet = FALSE,
                    clean = FALSE,
                    install_path = file.path(normalizePath(Sys.getenv("RUNNER_TEMP"), winslash = "/"), "package")
                  )
                  print(cov)
                  covr::to_cobertura(cov)
              shell: Rscript {0}

            - name: Upload coverage to Codecov
              uses: codecov/codecov-action@v5
              with:
                  files: ./cobertura.xml
                  plugins: noop
                  disable_search: true
                  fail_ci_if_error: ${{ github.event_name != 'pull_request' }}
                  token: ${{ secrets.CODECOV_TOKEN }}

            - name: Show testthat output
              if: always()
              run: |
                  find "${{ runner.temp }}/package" -name 'testthat.Rout*' -exec cat '{}' \; || true
              shell: bash

            - name: Upload test results
              if: failure()
              uses: actions/upload-artifact@v4
              with:
                  name: coverage-test-failures
                  path: ${{ runner.temp }}/package
